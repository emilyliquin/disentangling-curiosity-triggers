/////////////////////// OBSERVATION - SET UP TRIALS ////////////////////////////


function observation_setup(set) {
	
	// generate feedback probabilities
	var weights = jsPsych.randomization.repeat([0.2, 0.65, 0.8],1)

	var a_weight = weights[0]; // probability for left mine
	var b_weight = weights[1]; // probability for middle mine
	var c_weight = weights[2]; // probability for right mine
	var weights_free_a = [a_weight, 1-a_weight]; // probabilities for free will (when intervention doesn't occur)
	var weights_free_b = [b_weight, 1-b_weight]; // probabilities for free will (when intervention doesn't occur)
	var weights_free_c = [c_weight, 1-c_weight]; // probabilities for free will (when intervention doesn't occur)

	// set number of trials
	var n_trials_forced = 6
	var n_trials_free = 9 
	var n_trials = n_trials_forced + n_trials_free

	// set forced choices

	var choices_unshuffle = repeatSimple(1, n_trials_forced/3).concat(repeatSimple(2, n_trials_forced/3), repeatSimple(3, n_trials_forced/3))
	var choices = jsPsych.randomization.repeat(choices_unshuffle, 1)

	//set forced feedback
	var feedback_80 = jsPsych.randomization.repeat([1,1], 1)
	var feedback_65 = jsPsych.randomization.repeat([1,0], 1)
	var feedback_20 = jsPsych.randomization.repeat([0,0], 1)

	var feedback_forced = []

	for(var i = 0; i < choices.length; i++){
		if(choices[i] == 1){
			if(a_weight == 0.2){
				feedback_forced.push(feedback_20[0])
				feedback_20.shift()
			} else if(a_weight == 0.65){
				feedback_forced.push(feedback_65[0])
				feedback_65.shift()				
			} else if(a_weight == 0.8){
				feedback_forced.push(feedback_80[0])
				feedback_80.shift()		
			}
		} else if(choices[i] == 2){
			if(b_weight == 0.2){
				feedback_forced.push(feedback_20[0])
				feedback_20.shift()
			} else if(b_weight == 0.65){
				feedback_forced.push(feedback_65[0])
				feedback_65.shift()				
			} else if(b_weight == 0.8){
				feedback_forced.push(feedback_80[0])
				feedback_80.shift()		
			}
		} else if(choices[i] == 3){
			if(c_weight == 0.2){
				feedback_forced.push(feedback_20[0])
				feedback_20.shift()
			} else if(c_weight == 0.65){
				feedback_forced.push(feedback_65[0])
				feedback_65.shift()				
			} else if(c_weight == 0.8){
				feedback_forced.push(feedback_80[0])
				feedback_80.shift()		
			}
		}
	}


	// set sequence of interventions - ONLY DURING FREE
	if(Math.random < 0.5) {
		var n_latent_trials = Math.floor(n_trials_free*.30); //number of latent trials per block
	} else {
		var n_latent_trials = Math.ceil(n_trials_free*.30); //number of latent trials per block
	}
	var n_reg_trials = n_trials_free-n_latent_trials; //number of normal trials per block
	var ones = repeatSimple(1,n_latent_trials);
	var zeros = repeatSimple(0,n_reg_trials);
	var trial_array = ones.concat(zeros) //array of 1s and 0s, where 1 is intervention occurred and 0 is no intervention
	var latent_array1 = jsPsych.randomization.repeat(trial_array, 1) //shuffle latent agent intervention trial order

	// set reveals 
	var n_reveal = Math.round(n_trials*0.2) // HOW MANY SHOULD BE REVEALED
	var noreveal = repeatSimple(0, n_trials_free - n_reveal)
	var reveal = repeatSimple(1, n_reveal)
	var reveal_array = jsPsych.randomization.repeat(noreveal.concat(reveal), 1);

	var word_array = []
	var reveal_image_array = []
	for (var n = 0; n < latent_array1.length; n++){
		if(latent_array1[n] == 0){
			word_array.push("did not")
			reveal_image_array.push(agent_cond.image_reveal_no)
		} else {
			word_array.push("did")
			reveal_image_array.push(agent_cond.image_reveal_yes)
		}
	}



	set_array = {set: set, weights_free_a: weights_free_a, weights_free_b: weights_free_b, weights_free_c: weights_free_c, n_trials_forced: n_trials_forced, n_trials_free: n_trials_free, n_trials: n_trials, forced_choices: choices, feedback_forced: feedback_forced, latent_array1: latent_array1, reveal_array: reveal_array, word_array: word_array, reveal_image_array: reveal_image_array}

	return(set_array)
}

	return(test_array)
}
